<h2 class="sr-only">Таблица неправильных глаголов португальского языка, сгруппированных по семьям, с интерактивными шторками по лицам и временам</h2>
<style>
.fc{border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:20px;border:0.5px solid var(--color-border-tertiary)}
.tb{cursor:pointer;border-radius:20px;font-size:12px;font-weight:500;padding:4px 12px;border:1.5px solid;font-family:inherit;transition:opacity .15s}
.tb:hover{opacity:.72}
.cm{display:inline-block;padding:3px 10px;border-radius:4px;cursor:pointer;user-select:none;min-width:44px;text-align:center;font-weight:500;font-size:13px}
.cm:hover{filter:brightness(.82)}
.rb{cursor:pointer;border-radius:20px;font-size:12px;padding:4px 12px;border:0.5px dashed var(--color-border-secondary);background:transparent;color:var(--color-text-tertiary);font-family:inherit;font-weight:400}
.rb:hover{background:var(--color-background-secondary)}
</style>
<div style="padding:1.5rem 0 .5rem;text-align:center">
  <p style="margin:0 0 4px;font-size:11px;font-weight:500;letter-spacing:2px;color:var(--color-text-tertiary)">PORTUGUÊS · VERBOS IRREGULARES</p>
  <h2 style="margin:0 0 10px;font-size:22px;font-weight:500;color:var(--color-text-primary)">По семьям — с шторками</h2>
  <p style="margin:0;font-size:13px;color:var(--color-text-secondary)">Нажми кнопку лица → колонка скроется. Кликни <span style="background:var(--color-text-secondary);color:transparent;border-radius:3px;padding:1px 9px;font-size:12px">xxx</span> чтобы открыть.</p>
</div>
<div id="fams"></div>
<script>
const P=['eu','tu','ele/ela','nós','eles'];
const F=[
{id:'twins',bg:'≡',nm:'Близнецы: ir = ser',cl:'#E24B4A',
ds:'В португальском «идти» (ir) и «быть» (ser) полностью совпадают в прошедшем: fui, foste, foi, fomos, foram. Ещё в народной латыни ire «позаимствовал» формы esse — своих форм просто не осталось. Только контекст скажет, что имеется в виду.',
vs:[
{n:'ir',r:'идти',p:['vou','vais','vai','vamos','vão'],pt:['fui','foste','foi','fomos','foram']},
{n:'ser',r:'быть',p:['sou','és','é','somos','são'],pt:['fui','foste','foi','fomos','foram']},
]},
{id:'ive',bg:'iv',nm:'Семья -ive',cl:'#378ADD',
ds:'tive и estive — двоюродные братья из латинского «сильного» перфекта: tenui→tive, steti→estive. vir выбивается формой vim, но родство сразу видно в vieste, viemos — та же -i- основа на месте.',
vs:[
{n:'ter',r:'иметь',p:['tenho','tens','tem','temos','têm'],pt:['tive','tiveste','teve','tivemos','tiveram']},
{n:'estar',r:'находиться',p:['estou','estás','está','estamos','estão'],pt:['estive','estiveste','esteve','estivemos','estiveram']},
{n:'vir',r:'прийти',p:['venho','vens','vem','vimos','vêm'],pt:['vim','vieste','veio','viemos','vieram']},
]},
{id:'uve',bg:'ou',nm:'Семья -uve / -ude / -ouve',cl:'#1D9E75',
ds:'Основа -ou-/-u- — эхо латинского перфекта с суффиксом -u-: sapui→soube, potui→pude. Haver выжил почти только как houve («произошло»): houve um acidente. Во всех остальных лицах его давно вытеснил ter.',
vs:[
{n:'saber',r:'знать',p:['sei','sabes','sabe','sabemos','sabem'],pt:['soube','soubeste','soube','soubemos','souberam']},
{n:'poder',r:'мочь',p:['posso','podes','pode','podemos','podem'],pt:['pude','pudeste','pôde','pudemos','puderam']},
{n:'haver',r:'вспом.',p:['—','—','há','—','—'],pt:['—','—','houve','—','—']},
]},
{id:'str',bg:'S!',nm:'Сильный претерит',cl:'#7F77DD',
ds:'Ударение на основе, основа меняется радикально — это «сильный» перфект латыни. fiz ← лат. fecī (c→z), disse ← dīxī (x→ss). trouxe и pus — архаичные сигматические основы, уцелевшие только в этих словах.',
vs:[
{n:'fazer',r:'делать',p:['faço','fazes','faz','fazemos','fazem'],pt:['fiz','fizeste','fez','fizemos','fizeram']},
{n:'dizer',r:'говорить',p:['digo','dizes','diz','dizemos','dizem'],pt:['disse','disseste','disse','dissemos','disseram']},
{n:'trazer',r:'нести',p:['trago','trazes','traz','trazemos','trazem'],pt:['trouxe','trouxeste','trouxe','trouxemos','trouxeram']},
{n:'pôr',r:'класть',p:['ponho','pões','põe','pomos','põem'],pt:['pus','puseste','pôs','pusemos','puseram']},
]},
{id:'reb',bg:'R',nm:'Особняки',cl:'#BA7517',
ds:'dar — короткий -ar глагол, но претерит взят у -ir/-er: dei, deste, deu, — латинское dare спрягалось нестандартно ещё в античности. querer: основа quis- из лат. quaesīvī (я искал). Кстати, query (запрос) по-английски — дальний родственник.',
vs:[
{n:'dar',r:'дать',p:['dou','dás','dá','damos','dão'],pt:['dei','deste','deu','demos','deram']},
{n:'querer',r:'хотеть',p:['quero','queres','quer','queremos','querem'],pt:['quis','quiseste','quis','quisemos','quiseram']},
]},
{id:'alm',bg:'≈',nm:'«Почти правильные»',cl:'#3D8116',
ds:'В настоящем — чередования гласных (o→u у dormir, e→i у pedir/servir, ouço у ouvir), но прошедшее абсолютно правильное по типу -er/-ir. Достаточно выучить форму настоящего — прошедшее достанется бесплатно.',
vs:[
{n:'dormir',r:'спать',p:['durmo','dormes','dorme','dormimos','dormem'],pt:['dormi','dormiste','dormiu','dormimos','dormiram']},
{n:'ouvir',r:'слышать',p:['ouço','ouves','ouve','ouvimos','ouvem'],pt:['ouvi','ouviste','ouviu','ouvimos','ouviram']},
{n:'pedir',r:'просить',p:['peço','pedes','pede','pedimos','pedem'],pt:['pedi','pediste','pediu','pedimos','pediram']},
{n:'servir',r:'служить',p:['sirvo','serves','serve','servimos','servem'],pt:['servi','serviste','serviu','servimos','serviram']},
{n:'subir',r:'подняться',p:['subo','sobes','sobe','subimos','sobem'],pt:['subi','subiste','subiu','subimos','subiram']},
{n:'perder',r:'терять',p:['perco','perdes','perde','perdemos','perdem'],pt:['perdi','perdeste','perdeu','perdemos','perderam']},
{n:'ler',r:'читать',p:['leio','lês','lê','lemos','lêem'],pt:['li','leste','leu','lemos','leram']},
{n:'sair',r:'выйти',p:['saio','sais','sai','saímos','saem'],pt:['saí','saíste','saiu','saímos','saíram']},
]},
];

const S={};
F.forEach(f=>S[f.id]={hc:new Set(),ht:new Set(),rv:new Set()});

function rc(f){
const s=S[f.id];
const vt=['presente','pretérito'].filter(t=>!s.ht.has(t));
const ah=s.hc.size>0||s.ht.size>0;

const pb=P.map((p,i)=>{
const h=s.hc.has(i);
return`<button class="tb" style="background:${h?f.cl:'transparent'};color:${h?'#fff':f.cl};border-color:${f.cl}" onclick="tc('${f.id}',${i})">${h?'<i class="ti ti-lock" aria-hidden="true" style="font-size:10px;margin-right:2px"></i>':''}${p}</button>`;
}).join('');

const tb=['presente','pretérito'].map(t=>{
const h=s.ht.has(t);
return`<button class="tb" style="background:${h?'var(--color-text-tertiary)':'transparent'};color:${h?'var(--color-background-primary)':'var(--color-text-secondary)'};border-color:var(--color-border-secondary)" onclick="tt('${f.id}','${t}')">${h?'<i class="ti ti-eye-off" aria-hidden="true" style="font-size:10px;margin-right:2px"></i>':''}${t}</button>`;
}).join('');

const trs=f.vs.map((v,vi)=>{
if(vt.length===0)return`<tr><td colspan="${2+P.length}" style="text-align:center;padding:12px;font-size:12px;color:var(--color-text-tertiary)">— оба времени скрыты —</td></tr>`;
return vt.map((t,ti)=>{
const ip=t==='pretérito';
const rb=vi%2===0?(ip?f.cl+'0C':'transparent'):(ip?f.cl+'18':f.cl+'07');
const vc=ti===0?`<td rowspan="${vt.length}" style="padding:10px 14px;border-right:0.5px solid var(--color-border-tertiary);vertical-align:middle;min-width:85px"><span style="font-weight:500;color:${f.cl};font-size:15px;display:block">${v.n}</span><span style="font-size:11px;color:var(--color-text-tertiary)">${v.r}</span></td>`:'';
const tl=`<td style="padding:8px 10px;font-size:11px;font-weight:${ip?'500':'400'};color:${ip?f.cl:'var(--color-text-tertiary)'};white-space:nowrap">${ip?'★ прош.':'наст.'}</td>`;
const fcs=P.map((_,i)=>{
const fm=v[ip?'pt':'p'][i];
const ih=s.hc.has(i);
if(!ih)return`<td style="padding:8px 12px;color:${fm==='—'?'var(--color-border-secondary)':'var(--color-text-primary)'};font-weight:${ip&&fm!=='—'?'500':'400'}">${fm}</td>`;
if(fm==='—')return`<td style="padding:8px 12px;text-align:center;color:var(--color-border-tertiary)">—</td>`;
const ir=s.rv.has(`${v.n}:${t}:${i}`);
return`<td style="padding:6px 8px;text-align:center;background:${f.cl}09"><span class="cm" style="background:${ir?f.cl+'25':f.cl};color:${ir?f.cl:'transparent'}" onclick="rv_('${f.id}','${v.n}:${t}:${i}')">${fm}</span></td>`;
}).join('');
const bb=ip&&ti===vt.length-1?`1px solid ${f.cl}35`:`0.5px solid var(--color-border-tertiary)`;
return`<tr style="background:${rb};border-bottom:${bb}">${vc}${tl}${fcs}</tr>`;
}).join('');
}).join('');

const phs=P.map((p,i)=>{
const h=s.hc.has(i);
return`<th style="padding:7px 12px;text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;color:${h?'var(--color-text-tertiary)':f.cl};background:${h?'var(--color-background-secondary)':f.cl+'12'}" onclick="tc('${f.id}',${i})">${h?'?':p}</th>`;
}).join('');

return`<div class="fc">
<div style="padding:16px 20px;background:var(--color-background-secondary);border-left:4px solid ${f.cl};border-radius:0;border-bottom:0.5px solid var(--color-border-tertiary)">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:${f.cl};color:#fff;font-size:11px;font-weight:500;flex-shrink:0;letter-spacing:-0.5px">${f.bg}</span>
<span style="font-size:17px;font-weight:500;color:${f.cl}">${f.nm}</span>
</div>
<p style="margin:0;font-size:13px;color:var(--color-text-secondary);line-height:1.65;font-style:italic">${f.ds}</p>
</div>
<div style="padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:0.5px solid var(--color-border-tertiary)">
<span style="font-size:11px;color:var(--color-text-tertiary);font-weight:500;letter-spacing:.5px;margin-right:1px">лицо:</span>
${pb}
<span style="width:0.5px;height:18px;background:var(--color-border-secondary);margin:0 4px;flex-shrink:0"></span>
<span style="font-size:11px;color:var(--color-text-tertiary);font-weight:500;letter-spacing:.5px;margin-right:1px">время:</span>
${tb}
<span style="flex:1"></span>
${ah?`<button class="rb" onclick="rs_('${f.id}')">↺ показать всё</button>`:''}
</div>
<div style="overflow-x:auto">
<table style="width:100%;border-collapse:collapse;min-width:480px;font-size:14px">
<thead><tr style="border-bottom:1px solid ${f.cl}40">
<th style="padding:7px 14px;text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--color-text-secondary);border-right:0.5px solid var(--color-border-tertiary)">глагол</th>
<th style="padding:7px 10px;text-align:left;font-size:11px;color:var(--color-text-tertiary);font-weight:400">↕</th>
${phs}
</tr></thead>
<tbody>${trs}</tbody>
</table>
</div>
</div>`;
}

function ra(){document.getElementById('fams').innerHTML=F.map(rc).join('')}
function tc(id,i){const s=S[id];s.hc.has(i)?s.hc.delete(i):s.hc.add(i);for(const k of[...s.rv])if(k.endsWith(':'+i))s.rv.delete(k);ra()}
function tt(id,t){const s=S[id];s.ht.has(t)?s.ht.delete(t):s.ht.add(t);ra()}
function rv_(id,k){const s=S[id];s.rv.has(k)?s.rv.delete(k):s.rv.add(k);ra()}
function rs_(id){S[id]={hc:new Set(),ht:new Set(),rv:new Set()};ra()}
ra();
</script>
